<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherfall | The Grand Grimoire</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --page-bg: #fdfaf3;
            --ink: #1c1917;
            --gold: #b59410;
            --gold-dim: rgba(181, 148, 16, 0.2);
            --binding: #3f1d0b;
            --void: #030303;
            --discord: #5865F2;
            --nav-height: 70px;
            --book-max-width: 1200px;
        }

        * { margin:0; padding:0; box-sizing:border-box; outline: none; }
        
        body { 
            background-color: var(--void);
            color: var(--ink); 
            font-family: 'IM Fell DW Pica', serif;
            font-size: 18px;
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            opacity: 0.4;
            pointer-events: none;
            z-index: 50;
        }

        nav {
            position: fixed; top: 0; width: 100%; height: var(--nav-height);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .logo-container {
            display: flex; align-items: center; gap: 15px; text-decoration: none;
            transition: transform 0.3s ease;
        }
        .logo-container:hover { transform: scale(1.02); }

        .aether-logo {
            width: 45px; height: 45px;
            position: relative;
            background: #111;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: grid; place-items: center;
        }
        .aether-logo::after {
            content: "";
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--gold);
            position: absolute; top: 10px;
        }

        .nav-title { 
            color: var(--gold); 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 1.6rem; 
            letter-spacing: 3px;
        }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .discord-btn { 
            color: var(--discord); 
            text-decoration: none; 
            font-weight: 700; 
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem; 
            letter-spacing: 1px;
        }

        .grimoire-container {
            flex: 1;
            width: 90%;
            max-width: var(--book-max-width);
            margin: calc(var(--nav-height) + 40px) auto 60px;
            position: relative;
            background-color: var(--binding);
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            display: flex;
        }

        .book-pages {
            flex: 1;
            background-color: var(--page-bg);
            background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        .book-pages::before {
            content: "";
            position: absolute; top: 0; left: 50%; width: 60px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 30%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0) 100%);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .page {
            padding: 60px 50px;
            position: relative;
            z-index: 5;
        }
        .left-page { border-right: 1px solid rgba(0,0,0,0.05); }

        header { text-align: center; margin-bottom: 50px; }
        header .grimoire-label { 
            font-family: 'IM Fell English SC', serif; 
            color: var(--gold); 
            letter-spacing: 4px; font-size: 1rem; margin-bottom: 10px; display: block;
        }
        header h1 { 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 4rem; 
            color: #111; 
            line-height: 1;
        }

        .section-label { 
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.5rem; color: #111; 
            margin-bottom: 25px; border-bottom: 2px solid var(--gold);
            display: inline-block; padding-bottom: 5px;
        }

        .character-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        .char-card { 
            border: 1px solid rgba(0,0,0,0.08); padding: 20px; 
            border-radius: 4px; transition: 0.3s ease; 
            background: rgba(255,255,255,0.3);
        }
        .char-card:hover { transform: translateY(-3px); background: #fff; }
        .char-card h3 { font-family: 'IM Fell English SC', serif; font-size: 1.4rem; color: #111; }

        .act-card { 
            margin-bottom: 30px; padding-bottom: 20px; 
            border-bottom: 1px double rgba(181, 148, 16, 0.3); 
        }
        .act-card h2 { font-family: 'IM Fell English SC', serif; font-size: 2rem; color: #111; margin-bottom: 10px; }
        .preview-text { font-size: 1.1rem; color: #222; display: block; margin-bottom: 15px; font-style: italic; }

        .btn { 
            padding: 10px 20px; cursor: pointer; border: none; 
            font-family: 'IM Fell English SC', serif; font-size: 1rem; letter-spacing: 1px;
            transition: 0.3s; border-radius: 2px;
        }
        .btn-gold { background: var(--gold); color: #fff; }
        .btn-gold:hover { background: #c9a514; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

        .pagination-controls {
            display: flex; justify-content: center; align-items: center;
            gap: 20px; margin-top: 20px; font-family: 'IM Fell English SC', serif;
        }
        .page-num { font-size: 1.1rem; color: var(--gold); }

        .admin-controls { margin-top: 10px; font-size: 0.8rem; display: flex; gap: 10px;}
        .btn-edit, .btn-erase { background: none; border: none; cursor: pointer; text-decoration: underline; font-weight: 700; }
        .btn-edit { color: var(--gold); } .btn-erase { color: #cc0000; }

        .reader-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 4000; overflow-y: auto; padding: 60px 20px;
        }
        .scroll-paper { 
            width: 100%; max-width: 800px; margin: 0 auto;
            background: var(--page-bg); padding: 80px 60px; border-radius: 2px; position: relative;
        }
        .reader-close { position: absolute; top: 20px; right: 30px; background: none; border: none; font-size: 3rem; cursor: pointer; }

        #architectHUD { 
            display: none; position: fixed; right: 20px; top: calc(var(--nav-height) + 20px); 
            width: 320px; background: #111; border: 2px solid var(--gold); padding: 25px; 
            z-index: 2000; border-radius: 4px; color: #eee;
        }
        .hud-select, .input-field { width: 100%; padding: 12px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; }

        @media (max-width: 900px) {
            .book-pages { grid-template-columns: 1fr; }
            .book-pages::before { display: none; }
            .left-page { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.05); }
        }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo-container">
        <div class="aether-logo"></div> <span class="nav-title">AETHERFALL</span>
    </a>
    <div class="nav-right">
        <a href="https://discord.gg/yq2DdHhG" target="_blank" class="discord-btn">JOIN DISCORD</a>
        <button class="btn btn-outline" id="authBtn">LOGIN</button>
    </div>
</nav>

<div class="grimoire-container">
    <div class="book-pages">
        <div class="page left-page">
            <header>
                <span class="grimoire-label">THE GRAND GRIMOIRE</span>
                <h1>Aetherfall</h1>
            </header>
            <h2 class="section-label">Character Dossiers</h2>
            <div class="character-grid" id="dynamic-chars"></div>
        </div>
        <div class="page right-page">
            <h2 class="section-label">Chronicles</h2>
            <div id="dynamic-acts"></div>
        </div>
    </div>
</div>

<div id="architectHUD">
    <h4>LATTICE COMMAND</h4>
    <input type="hidden" id="editId">
    <select id="postType" class="hud-select">
        <option value="acts">New Chronicle (Act)</option>
        <option value="chars">New Character Dossier</option>
    </select>
    <input type="text" id="postTitle" placeholder="Title" class="input-field">
    <textarea id="postPreview" placeholder="Summary" class="input-field"></textarea>
    <textarea id="postContent" placeholder="Full Text" class="input-field" style="height:120px;"></textarea>
    <button class="btn btn-gold" id="saveBtn" style="width:100%;">COMMIT TO GRIMOIRE</button>
</div>

<div id="readerOverlay" class="reader-overlay">
    <div class="scroll-paper">
        <button class="reader-close" onclick="closeReader()">&times;</button>
        <h2 id="readerTitle" style="font-family:'Cinzel Decorative'; text-align:center; margin-bottom:30px;"></h2>
        <div id="readerBody" style="white-space:pre-wrap;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDvY6EBbx55sK3F5ovjWDGexG9N58WXS-4",
        authDomain: "aetherfall-d35a2.firebaseapp.com",
        projectId: "aetherfall-d35a2",
        storageBucket: "aetherfall-d35a2.firebasestorage.app",
        messagingSenderId: "107057087956",
        appId: "1:107057087956:web:cd958bc57a400502d1c241"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_UID = "RJUAtLpVpoacDbdYORcUiSIU20v2";

    let allActs = [];
    let allChars = [];
    let currentActPage = 0;
    const ACTS_PER_PAGE = 3;

    onSnapshot(query(collection(db, "acts"), orderBy("createdAt", "desc")), (snap) => {
        allActs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
    });
    onSnapshot(query(collection(db, "chars"), orderBy("createdAt", "asc")), (snap) => {
        allChars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
    });

    function renderAll() {
        const actCont = document.getElementById('dynamic-acts');
        const charCont = document.getElementById('dynamic-chars');
        actCont.innerHTML = ""; charCont.innerHTML = "";
        const isAdmin = (auth.currentUser?.uid === ADMIN_UID);

        allChars.forEach(char => {
            let adminUI = isAdmin ? `<div class="admin-controls"><button class="btn-edit" onclick="editEntry('chars', '${char.id}')">[EDIT]</button><button class="btn-erase" onclick="deleteEntry('chars', '${char.id}')">[ERASE]</button></div>` : "";
            charCont.innerHTML += `<div class="char-card"><h3>${char.title}</h3><p>${char.preview}</p>${adminUI}</div>`;
        });

        // Pagination Logic
        const start = currentActPage * ACTS_PER_PAGE;
        const end = start + ACTS_PER_PAGE;
        const pageItems = allActs.slice(start, end);

        pageItems.forEach(act => {
            window[`act_${act.id}`] = act;
            let adminUI = isAdmin ? `<div class="admin-controls" style="margin-left:15px;"><button class="btn-edit" onclick="editEntry('acts', '${act.id}')">[EDIT]</button><button class="btn-erase" onclick="deleteEntry('acts', '${act.id}')">[ERASE]</button></div>` : "";
            actCont.innerHTML += `
                <div class="act-card">
                    <h2>${act.title}</h2>
                    <span class="preview-text">${act.preview}</span>
                    <div style="display:flex; align-items:center;">
                        <button class="btn btn-gold" onclick="openReader('${act.id}')">READ CHRONICLE</button>
                        ${adminUI}
                    </div>
                </div>`;
        });

        if (allActs.length > ACTS_PER_PAGE) {
            actCont.innerHTML += `
                <div class="pagination-controls">
                    <button class="btn btn-outline" onclick="changePage(-1)" ${currentActPage === 0 ? 'style="visibility:hidden"' : ''}>← Previous</button>
                    <span class="page-num">Page ${currentActPage + 1}</span>
                    <button class="btn btn-outline" onclick="changePage(1)" ${end >= allActs.length ? 'style="visibility:hidden"' : ''}>Next →</button>
                </div>`;
        }
    }

    window.changePage = (dir) => { currentActPage += dir; renderAll(); };

    document.getElementById('saveBtn').onclick = async () => {
        const id = document.getElementById('editId').value;
        const type = document.getElementById('postType').value;
        const data = {
            title: document.getElementById('postTitle').value,
            preview: document.getElementById('postPreview').value,
            content: document.getElementById('postContent').value,
            updatedAt: serverTimestamp()
        };
        if(!id) { data.createdAt = serverTimestamp(); await addDoc(collection(db, type), data); }
        else { await updateDoc(doc(db, type, id), data); }
        location.reload(); 
    };

    window.editEntry = (type, id) => {
        const item = type === 'acts' ? allActs.find(a => a.id === id) : allChars.find(c => c.id === id);
        document.getElementById('editId').value = id;
        document.getElementById('postTitle').value = item.title;
        document.getElementById('postPreview').value = item.preview;
        document.getElementById('postContent').value = item.content || "";
        window.scrollTo(0,0);
    };

    window.deleteEntry = async (col, id) => { if(confirm("Erase entry?")) await deleteDoc(doc(db, col, id)); };

    window.openReader = (id) => {
        const act = window[`act_${id}`];
        document.getElementById('readerTitle').innerText = act.title;
        document.getElementById('readerBody').innerText = act.content || "Sealed.";
        document.getElementById('readerOverlay').style.display = "block";
    };
    window.closeReader = () => { document.getElementById('readerOverlay').style.display = "none"; };

    document.getElementById('authBtn').onclick = () => {
        if(auth.currentUser) signOut(auth);
        else {
            const e = prompt("Email:"), k = prompt("Passkey:");
            if(e && k) signInWithEmailAndPassword(auth, e, k);
        }
    };

    onAuthStateChanged(auth, (u) => {
        document.getElementById('architectHUD').style.display = (u?.uid === ADMIN_UID) ? "block" : "none";
        document.getElementById('authBtn').innerText = u ? "LOGOUT" : "LOGIN";
        renderAll();
    });
</script>
</body>
</html>
