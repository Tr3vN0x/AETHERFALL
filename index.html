<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherfall | The Grand Grimoire</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --page-bg: #fdfaf3;
            --ink: #1c1917;
            --gold: #b59410;
            --gold-dim: rgba(181, 148, 16, 0.2);
            --binding: #3f1d0b;
            --void: #030303;
            --discord: #5865F2;
            --nav-height: 70px;
            --book-max-width: 1200px;
        }

        * { margin:0; padding:0; box-sizing:border-box; outline: none; }
        
        body { 
            background-color: var(--void);
            color: var(--ink); 
            font-family: 'IM Fell DW Pica', serif;
            font-size: 18px;
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Fixed Background Texture */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            opacity: 0.4;
            pointer-events: none;
            z-index: 50;
        }

        nav {
            position: fixed; top: 0; width: 100%; height: var(--nav-height);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; z-index: 1000;
        }

        .nav-title { color: var(--gold); font-family: 'Cinzel Decorative', serif; font-size: 1.6rem; letter-spacing: 3px; text-decoration:none;}

        /* --- The Book Container --- */
        .grimoire-container {
            flex: 1;
            width: 90%;
            max-width: var(--book-max-width);
            margin: calc(var(--nav-height) + 40px) auto 60px;
            background-color: var(--binding);
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            display: flex;
            min-height: 700px; /* Keeps book shape consistent */
        }

        .book-pages {
            flex: 1;
            background-color: var(--page-bg);
            background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        .page { padding: 40px; display: flex; flex-direction: column; }
        .left-page { border-right: 1px solid rgba(0,0,0,0.1); }

        /* --- THE FIX: Scaling & Order --- */
        #dynamic-acts, #dynamic-chars {
            max-height: 550px; /* Prevents book from extending downwards */
            overflow-y: auto;
            padding-right: 15px;
        }

        /* Custom Scrollbar */
        #dynamic-acts::-webkit-scrollbar { width: 4px; }
        #dynamic-acts::-webkit-scrollbar-thumb { background: var(--gold); }

        .section-label { 
            font-family: 'Cinzel Decorative', serif; 
            color: var(--gold); 
            border-bottom: 1px solid var(--gold); 
            margin-bottom: 20px; 
            font-size: 1.4rem;
        }

        .act-card { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px double var(--gold-dim); }
        .act-card h2 { font-family: 'IM Fell English SC', serif; font-size: 1.8rem; margin-bottom: 5px; }

        .btn { padding: 8px 15px; cursor: pointer; font-family: 'IM Fell English SC', serif; transition: 0.3s; }
        .btn-gold { background: var(--gold); color: white; border: none; }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }

        .pagination-controls { display: flex; justify-content: center; gap: 15px; align-items: center; margin-top: auto; padding-top: 20px; }

        /* Reader Overlay */
        .reader-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 5000; overflow-y: auto; padding: 40px; }
        .scroll-paper { width: 100%; max-width: 800px; margin: 0 auto; background: var(--page-bg); padding: 50px; border-radius: 5px; position: relative; }
        .reader-close { position: absolute; top: 10px; right: 20px; font-size: 2rem; background: none; border: none; cursor: pointer; }

        /* Admin HUD */
        #architectHUD { display: none; position: fixed; right: 20px; top: 80px; width: 300px; background: #111; color: white; padding: 20px; border: 1px solid var(--gold); z-index: 2000; }
        .hud-input { width: 100%; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; padding: 8px; }

        @media (max-width: 900px) { .book-pages { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <a href="#" class="nav-title">AETHERFALL</a>
    <div style="display:flex; gap:20px; align-items:center;">
        <a href="https://discord.gg/yq2DdHhG" target="_blank" style="color:var(--discord); text-decoration:none; font-weight:bold;">DISCORD</a>
        <button id="authBtn" class="btn btn-outline">OWNER</button>
    </div>
</nav>

<div class="grimoire-container">
    <div class="book-pages">
        <div class="page left-page">
            <h2 class="section-label">Dossiers</h2>
            <div id="dynamic-chars"></div>
        </div>
        <div class="page right-page">
            <h2 class="section-label">Chronicles</h2>
            <div id="dynamic-acts"></div>
            <div id="pagination" class="pagination-controls"></div>
        </div>
    </div>
</div>

<div id="architectHUD">
    <h3 style="color:var(--gold)">Lattice Command</h3>
    <select id="postType" class="hud-input">
        <option value="acts">New Act</option>
        <option value="chars">New Character</option>
    </select>
    <input type="text" id="postTitle" placeholder="Title (e.g. Act IV)" class="hud-input">
    <textarea id="postPreview" placeholder="Summary" class="hud-input"></textarea>
    <textarea id="postContent" placeholder="Full Story Text" class="hud-input" style="height:100px;"></textarea>
    <button onclick="saveToFirebase()" class="btn btn-gold" style="width:100%">UPLOAD</button>
</div>

<div id="readerOverlay" class="reader-overlay">
    <div class="scroll-paper">
        <button class="reader-close" onclick="closeReader()">&times;</button>
        <h2 id="readerTitle" style="font-family:'Cinzel Decorative'; text-align:center; margin-bottom:20px;"></h2>
        <div id="readerBody" style="white-space:pre-wrap;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDvY6EBbx55sK3F5ovjWDGexG9N58WXS-4",
        authDomain: "aetherfall-d35a2.firebaseapp.com",
        projectId: "aetherfall-d35a2",
        storageBucket: "aetherfall-d35a2.firebasestorage.app",
        messagingSenderId: "107057087956",
        appId: "1:107057087956:web:cd958bc57a400502d1c241"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_UID = "RJUAtLpVpoacDbdYORcUiSIU20v2";

    let allActs = [];
    let currentPage = 0;
    const itemsPerPage = 3;

    // Fetch Acts in Order (Act I, Act II...)
    onSnapshot(query(collection(db, "acts"), orderBy("createdAt", "asc")), (snap) => {
        allActs = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderActs();
    });

    // Fetch Characters
    onSnapshot(query(collection(db, "chars"), orderBy("createdAt", "asc")), (snap) => {
        const cont = document.getElementById('dynamic-chars');
        cont.innerHTML = "";
        snap.forEach(d => {
            const c = d.data();
            cont.innerHTML += `<div class="act-card"><h3>${c.title}</h3><p style="font-size:0.9rem">${c.preview}</p></div>`;
        });
    });

    window.renderActs = () => {
        const cont = document.getElementById('dynamic-acts');
        const pag = document.getElementById('pagination');
        cont.innerHTML = "";
        
        const start = currentPage * itemsPerPage;
        const end = start + itemsPerPage;
        const pageItems = allActs.slice(start, end);

        pageItems.forEach(act => {
            // Create reader reference
            window[`act_${act.id}`] = act;
            cont.innerHTML += `
                <div class="act-card">
                    <h2>${act.title}</h2>
                    <p style="font-style:italic; font-size:0.9rem; margin-bottom:10px;">${act.preview}</p>
                    <button class="btn btn-gold" onclick="openReader('${act.id}')">READ FULL CHRONICLE</button>
                </div>`;
        });

        // Update Pagination
        if(allActs.length > itemsPerPage) {
            pag.innerHTML = `
                <button class="btn btn-outline" onclick="changePage(-1)" ${currentPage === 0 ? 'style="visibility:hidden"' : ''}>← Prev</button>
                <span style="color:var(--gold)">Page ${currentPage + 1}</span>
                <button class="btn btn-outline" onclick="changePage(1)" ${end >= allActs.length ? 'style="visibility:hidden"' : ''}>Next →</button>
            `;
        }
    };

    window.changePage = (dir) => { currentPage += dir; renderActs(); };

    window.openReader = (id) => {
        const act = window[`act_${id}`];
        document.getElementById('readerTitle').innerText = act.title;
        document.getElementById('readerBody').innerText = act.content;
        document.getElementById('readerOverlay').style.display = "block";
    };

    window.closeReader = () => { document.getElementById('readerOverlay').style.display = "none"; };

    window.saveToFirebase = async () => {
        const type = document.getElementById('postType').value;
        const data = {
            title: document.getElementById('postTitle').value,
            preview: document.getElementById('postPreview').value,
            content: document.getElementById('postContent').value,
            createdAt: serverTimestamp()
        };
        await addDoc(collection(db, type), data);
        alert("Committed to the Aether.");
        location.reload();
    };

    onAuthStateChanged(auth, (u) => {
        document.getElementById('architectHUD').style.display = (u?.uid === ADMIN_UID) ? "block" : "none";
        document.getElementById('authBtn').innerText = u ? "LOGOUT" : "OWNER";
    });

    document.getElementById('authBtn').onclick = () => {
        if(auth.currentUser) signOut(auth);
        else {
            const e = prompt("Email:"), p = prompt("Password:");
            if(e && p) signInWithEmailAndPassword(auth, e, p);
        }
    };
</script>
</body>
</html>
