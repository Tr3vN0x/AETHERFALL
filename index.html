<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherfall | The Grand Grimoire</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* The Color Palette of Ancient Magic */
            --page-bg: #fdfaf3; /* Realistic aged vellum */
            --ink: #1c1917; /* Dark charcoal ink, softer than pure black */
            --gold: #b59410; /* Weathered gold leaf */
            --gold-dim: rgba(181, 148, 16, 0.2);
            --binding: #3f1d0b; /* Dark leather book binding */
            --void: #030303; /* Deep space around the book */
            --discord: #5865F2;
            
            /* Spacing & Structure */
            --nav-height: 70px;
            --book-max-width: 1200px;
        }

        /* --- Fundamental Reset --- */
        * { margin:0; padding:0; box-sizing:border-box; outline: none; }
        
        body { 
            background-color: var(--void);
            color: var(--ink); 
            font-family: 'IM Fell DW Pica', serif; /* Classic, imperfect book serif */
            font-size: 18px;
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Realistic Texture Overlay --- */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            opacity: 0.4;
            pointer-events: none;
            z-index: 50;
        }

        /* --- NAVIGATION: The Book Spine --- */
        nav {
            position: fixed; top: 0; width: 100%; height: var(--nav-height);
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        /* CONCEPT LOGO: The Shattered Aether */
        .logo-container {
            display: flex; align-items: center; gap: 15px; text-decoration: none;
            transition: transform 0.3s ease;
        }
        .logo-container:hover { transform: scale(1.02); }

        .aether-logo {
            width: 45px; height: 45px;
            position: relative;
            background: #111;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: grid; place-items: center;
            box-shadow: 0 0 15px var(--gold-dim);
        }
        /* The central "Fall" shard */
        .aether-logo::after {
            content: "";
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 25px solid var(--gold);
            position: absolute; top: 10px;
            filter: drop-shadow(0 0 5px var(--gold));
        }

        .nav-title { 
            color: var(--gold); 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 1.6rem; 
            letter-spacing: 3px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .discord-btn { 
            color: var(--discord); 
            text-decoration: none; 
            font-weight: 700; 
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem; 
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .discord-btn:hover { text-shadow: 0 0 10px rgba(88, 101, 242, 0.6); }

        /* --- THE GRIMOIRE: The Open Book Structure --- */
        .grimoire-container {
            flex: 1;
            width: 90%;
            max-width: var(--book-max-width);
            margin: calc(var(--nav-height) + 40px) auto 60px;
            position: relative;
            background-color: var(--binding);
            background-image: url('https://www.transparenttextures.com/patterns/dark-leather.png');
            padding: 15px; /* Leather border */
            border-radius: 8px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.8);
            display: flex;
        }

        /* The Pages (Left & Right) */
        .book-pages {
            flex: 1;
            background-color: var(--page-bg);
            background-image: url('https://www.transparenttextures.com/patterns/old-paper.png');
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Two-page spread */
            gap: 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
        }

        /* The Spine Shadow (Down the middle) */
        .book-pages::before {
            content: "";
            position: absolute; top: 0; left: 50%; width: 60px; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,0.2) 30%, rgba(0,0,0,0.2) 70%, rgba(0,0,0,0) 100%);
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        /* General Page Styling */
        .page {
            padding: 60px 50px;
            position: relative;
            z-index: 5;
        }
        .left-page { border-right: 1px solid rgba(0,0,0,0.05); }

        /* --- HEADER (On the left page) --- */
        header { text-align: center; margin-bottom: 50px; }
        header .grimoire-label { 
            font-family: 'IM Fell English SC', serif; 
            color: var(--gold); 
            letter-spacing: 4px; font-size: 1rem; margin-bottom: 10px; display: block;
        }
        header h1 { 
            font-family: 'Cinzel Decorative', serif; 
            font-size: 4rem; 
            color: #111; 
            line-height: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Section Titles */
        .section-label { 
            font-family: 'Cinzel Decorative', serif;
            font-size: 1.5rem; color: #111; 
            margin-bottom: 25px; border-bottom: 2px solid var(--gold);
            display: inline-block; padding-bottom: 5px;
        }

        /* --- CHARACTERS (Dynamic Grid) --- */
        .character-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        .char-card { 
            border: 1px solid rgba(0,0,0,0.08); padding: 20px; 
            border-radius: 4px; transition: 0.3s ease; 
            background: rgba(255,255,255,0.3);
        }
        .char-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: #fff; }
        .char-card h3 { font-family: 'IM Fell English SC', serif; font-size: 1.4rem; color: #111; margin-bottom: 5px; }
        .char-card p { font-size: 1rem; color: #444; font-style: italic; }

        /* --- CHRONICLES (Right Page) --- */
        .act-card { 
            margin-bottom: 40px; padding-bottom: 20px; 
            border-bottom: 1px double rgba(181, 148, 16, 0.3); 
        }
        .act-card:last-child { border-bottom: none; }
        .act-card h2 { font-family: 'IM Fell English SC', serif; font-size: 2rem; color: #111; margin-bottom: 10px; }
        .preview-text { font-size: 1.2rem; color: #222; display: block; margin-bottom: 20px; font-weight: 400; }

        /* --- Buttons & Inputs (Immersive) --- */
        .btn { 
            padding: 10px 20px; cursor: pointer; border: none; 
            font-family: 'IM Fell English SC', serif; font-size: 1rem; letter-spacing: 1px;
            transition: 0.3s; border-radius: 2px;
        }
        .btn-gold { 
            background: var(--gold); color: #fff; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
        }
        .btn-gold:hover { background: #c9a514; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(181, 148, 16, 0.4); }
        
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
        .btn-outline:hover { background: var(--gold-dim); }

        /* Admin Controls */
        .admin-controls { margin-top: 10px; font-size: 0.8rem; display: flex; gap: 10px;}
        .btn-edit, .btn-erase { background: none; border: none; cursor: pointer; font-family: 'Inter'; text-decoration: underline; font-weight: 700; }
        .btn-edit { color: var(--gold); } .btn-erase { color: #cc0000; }

        /* --- THE READER (The Scroll overlay) --- */
        .reader-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 4000; overflow-y: auto; padding: 60px 20px;
        }
        .scroll-paper { 
            width: 100%; max-width: 800px; margin: 0 auto;
            background: var(--page-bg); background-image: url('https://www.transparenttextures.com/patterns/old-paper-2.png');
            padding: 80px 60px; box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            border-radius: 2px; position: relative;
            border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-image: url('https://i.imgur.com/7j4v7yU.png') 0 15 repeat; /* Optional scroll edge texture */
        }
        .reader-close { 
            position: absolute; top: 20px; right: 30px; background: none; border: none; 
            font-size: 3rem; color: #111; cursor: pointer; transition: 0.2s;
        }
        .reader-close:hover { color: var(--gold); transform: scale(1.1); }
        #readerTitle { font-family: 'Cinzel Decorative', serif; font-size: 2.5rem; color: #111; text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        #readerBody { font-size: 1.3rem; line-height: 1.9; color: var(--ink); text-align: justify; white-space: pre-wrap; }

        /* --- ARCHITECT HUD (The command panel) --- */
        #architectHUD { 
            display: none; position: fixed; right: 20px; top: calc(var(--nav-height) + 20px); 
            width: 320px; background: #111; border: 2px solid var(--gold); padding: 25px; 
            z-index: 2000; border-radius: 4px; color: #eee; font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #architectHUD h4 { font-family: 'Cinzel Decorative', serif; color: var(--gold); margin-bottom: 15px; text-align: center; }
        .hud-select, .input-field { 
            width: 100%; padding: 12px; margin-bottom: 12px; background: #000; 
            border: 1px solid #333; color: #fff; font-family: 'Inter', sans-serif; border-radius: 2px;
        }
        .input-field:focus { border-color: var(--gold); }
        textarea.input-field { resize: vertical; }

        /* --- RESPONSIVE DESIGN (Mobile Book) --- */
        @media (max-width: 900px) {
            .book-pages { grid-template-columns: 1fr; } /* Stack pages */
            .book-pages::before { display: none; } /* Remove spine */
            .left-page { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.05); }
            header h1 { font-size: 3rem; }
            .page { padding: 40px 25px; }
            #architectHUD { width: 100%; right: 0; top: auto; bottom: 0; border-width: 2px 0 0 0; border-radius: 10px 10px 0 0; }
        }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo-container">
        <div class="aether-logo"></div> <span class="nav-title">AETHERFALL</span>
    </a>
    <div class="nav-right">
        <a href="https://discord.gg/XSEwZU7c9H" target="_blank" class="discord-btn">JOIN DISCORD</a>
        <button class="btn btn-outline" id="authBtn">LOGIN</button>
    </div>
</nav>

<div class="grimoire-container">
    <div class="book-pages">
        
        <div class="page left-page">
            <header>
                <span class="grimoire-label">THE GRAND GRIMOIRE</span>
                <h1>Aetherfall</h1>
            </header>
            
            <h2 class="section-label">Character Dossiers</h2>
            <div class="character-grid" id="dynamic-chars">
                </div>
        </div>
        
        <div class="page right-page">
            <h2 class="section-label">Chronicles</h2>
            <div class="chronicle-container" id="dynamic-acts">
                </div>
        </div>
        
    </div>
</div>

<div id="architectHUD">
    <h4>LATTICE COMMAND</h4>
    <input type="hidden" id="editId">
    <select id="postType" class="hud-select">
        <option value="acts">New Chronicle (Act)</option>
        <option value="chars">New Character Dossier</option>
    </select>
    <input type="text" id="postTitle" placeholder="Entry Title (e.g., Act I or Character Name)" class="input-field">
    <textarea id="postPreview" placeholder="Brief Summary (shows on page)" class="input-field" style="height:70px;"></textarea>
    <textarea id="postContent" placeholder="Full Chronicle Text (Chronicles only)" class="input-field" style="height:120px;"></textarea>
    <button class="btn btn-gold" id="saveBtn" style="width:100%;">COMMIT TO GRIMOIRE</button>
</div>

<div id="readerOverlay" class="reader-overlay">
    <div class="scroll-paper">
        <button class="reader-close" onclick="closeReader()">&times;</button>
        <h2 id="readerTitle"></h2>
        <div id="readerBody"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your actual Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDvY6EBbx55sK3F5ovjWDGexG9N58WXS-4",
        authDomain: "aetherfall-d35a2.firebaseapp.com",
        projectId: "aetherfall-d35a2",
        storageBucket: "aetherfall-d35a2.firebasestorage.app",
        messagingSenderId: "107057087956",
        appId: "1:107057087956:web:cd958bc57a400502d1c241"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_UID = "RJUAtLpVpoacDbdYORcUiSIU20v2";

    let allActs = [];
    let allChars = [];

    // Real-time Listeners
    onSnapshot(query(collection(db, "acts"), orderBy("createdAt", "asc")), (snap) => {
        allActs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
    });
    onSnapshot(query(collection(db, "chars"), orderBy("createdAt", "asc")), (snap) => {
        allChars = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
    });

    // Rendering Engine
    function renderAll() {
        const actCont = document.getElementById('dynamic-acts');
        const charCont = document.getElementById('dynamic-chars');
        actCont.innerHTML = ""; charCont.innerHTML = "";
        const isAdmin = (auth.currentUser?.uid === ADMIN_UID);

        // Render Characters (Left Page)
        allChars.forEach(char => {
            let adminUI = isAdmin ? `
                <div class="admin-controls">
                    <button class="btn-edit" onclick="editEntry('chars', '${char.id}')">[EDIT]</button>
                    <button class="btn-erase" onclick="deleteEntry('chars', '${char.id}')">[ERASE]</button>
                </div>` : "";
            charCont.innerHTML += `<div class="char-card"><h3>${char.title}</h3><p>${char.preview}</p>${adminUI}</div>`;
        });

        // Render Acts (Right Page)
        allActs.forEach(act => {
            window[`act_${act.id}`] = act; // Store data for reader
            let adminUI = isAdmin ? `
                <div class="admin-controls" style="margin-left: 15px;">
                    <button class="btn-edit" onclick="editEntry('acts', '${act.id}')">[EDIT]</button>
                    <button class="btn-erase" onclick="deleteEntry('acts', '${act.id}')">[ERASE]</button>
                </div>` : "";
            actCont.innerHTML += `
                <div class="act-card">
                    <h2>${act.title}</h2>
                    <span class="preview-text">${act.preview}</span>
                    <div style="display:flex; align-items:center;">
                        <button class="btn btn-gold" onclick="openReader('${act.id}')">READ CHRONICLE</button>
                        ${adminUI}
                    </div>
                </div>`;
        });
    }

    // Architect Functions (Save/Edit/Delete)
    document.getElementById('saveBtn').onclick = async () => {
        const id = document.getElementById('editId').value;
        const type = document.getElementById('postType').value;
        const data = {
            title: document.getElementById('postTitle').value,
            preview: document.getElementById('postPreview').value,
            content: document.getElementById('postContent').value,
            updatedAt: serverTimestamp()
        };
        
        if(!data.title || !data.preview) return alert("Title and Preview are required.");

        try {
            if(!id) {
                data.createdAt = serverTimestamp();
                await addDoc(collection(db, type), data);
            } else {
                await updateDoc(doc(db, type, id), data);
            }
            // Reset Form
            document.getElementById('editId').value = ""; document.getElementById('postTitle').value = "";
            document.getElementById('postPreview').value = ""; document.getElementById('postContent').value = "";
            document.getElementById('saveBtn').innerText = "COMMIT TO GRIMOIRE";
        } catch(e) { alert("Error saving entry."); }
    };

    window.editEntry = (type, id) => {
        const item = type === 'acts' ? allActs.find(a => a.id === id) : allChars.find(c => c.id === id);
        document.getElementById('editId').value = id;
        document.getElementById('postType').value = type;
        document.getElementById('postTitle').value = item.title;
        document.getElementById('postPreview').value = item.preview;
        document.getElementById('postContent').value = item.content || "";
        document.getElementById('saveBtn').innerText = "UPDATE ENTRY";
        window.scrollTo(0,0); // Scroll to top to see HUD
    };

    window.deleteEntry = async (col, id) => { if(confirm("Permanently erase this entry from the Grimoire?")) await deleteDoc(doc(db, col, id)); };

    // Reader Functions
    window.openReader = (id) => {
        const act = window[`act_${id}`];
        document.getElementById('readerTitle').innerText = act.title;
        document.getElementById('readerBody').innerText = act.content || "This chronicle is sealed...";
        document.getElementById('readerOverlay').style.display = "block";
        document.body.style.overflow = "hidden"; // Prevent background scroll
    };
    window.closeReader = () => { document.getElementById('readerOverlay').style.display = "none"; document.body.style.overflow = "auto"; };

    // Auth Functions
    document.getElementById('authBtn').onclick = () => {
        if(auth.currentUser) signOut(auth);
        else {
            const e = prompt("Architect Email:"), k = prompt("Passkey:");
            if(e && k) signInWithEmailAndPassword(auth, e, k).catch(() => alert("Access Denied."));
        }
    };

    onAuthStateChanged(auth, (u) => {
        document.getElementById('architectHUD').style.display = (u?.uid === ADMIN_UID) ? "block" : "none";
        document.getElementById('authBtn').innerText = u ? "LOGOUT" : "LOGIN";
        renderAll(); // Re-render to show/hide admin controls
    });
</script>
</body>
</html>
