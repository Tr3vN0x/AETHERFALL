<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDvY6EBbx55sK3F5ovjWDGexG9N58WXS-4",
        authDomain: "aetherfall-d35a2.firebaseapp.com",
        projectId: "aetherfall-d35a2",
        storageBucket: "aetherfall-d35a2.firebasestorage.app",
        messagingSenderId: "107057087956",
        appId: "1:107057087956:web:cd958bc57a400502d1c241"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const ADMIN_UID = "RJUAtLpVpoacDbdYORcUiSIU20v2";

    let actsArray = [];
    let currentPage = 0;
    const itemsPerPage = 3; 

    // --- 1. DATA SYNC ---
    onSnapshot(query(collection(db, "acts"), orderBy("createdAt", "desc")), (snap) => {
        actsArray = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderActs(); // Re-render whenever a new Act (like Act IV) is added
    });

    onSnapshot(query(collection(db, "chars"), orderBy("createdAt", "asc")), (snap) => {
        const charCont = document.getElementById('dynamic-chars');
        charCont.innerHTML = "";
        snap.forEach(d => {
            const c = d.data();
            charCont.innerHTML += `
                <div class="char-card" style="margin-bottom:15px; padding:10px; border-left: 2px solid var(--gold);">
                    <strong style="font-family:'IM Fell English SC'">${c.title}</strong><br>
                    <small>${c.preview}</small>
                </div>`;
        });
    });

    // --- 2. THE PAGE TURNER ---
    window.renderActs = () => {
        const container = document.getElementById('dynamic-acts');
        container.innerHTML = "";
        
        const start = currentPage * itemsPerPage;
        const end = start + itemsPerPage;
        const paginatedItems = actsArray.slice(start, end);

        if (paginatedItems.length === 0) {
            container.innerHTML = "<p style='opacity:0.5'>The ink has not yet reached this page...</p>";
        }

        paginatedItems.forEach(act => {
            // Create the card
            const card = document.createElement('div');
            card.className = 'act-card';
            card.innerHTML = `
                <h3 style="font-family:'Cinzel Decorative'; margin-bottom:5px;">${act.title}</h3>
                <p style="font-size: 0.9rem; font-style: italic; margin-bottom:10px;">${act.preview}</p>
                <button class="btn-read" style="background:var(--gold); color:white; border:none; padding:5px 12px; cursor:pointer; font-family:serif;">READ FULL CHRONICLE</button>
            `;
            
            // Fix: Clicking this button opens the Actual Reader Overlay
            card.querySelector('.btn-read').onclick = () => openReader(act);
            container.appendChild(card);
        });

        // Update Page Number and Buttons
        document.getElementById('pageIndicator').innerText = `Page ${currentPage + 1}`;
        document.getElementById('prevPage').style.visibility = (currentPage === 0) ? "hidden" : "visible";
        document.getElementById('nextPage').style.visibility = (end >= actsArray.length) ? "hidden" : "visible";
    };

    window.changePage = (dir) => {
        currentPage += dir;
        renderActs();
    };

    // --- 3. THE FULL TEXT READER ---
    // This connects to the 'readerOverlay' div in your HTML
    window.openReader = (act) => {
        const overlay = document.getElementById('readerOverlay');
        document.getElementById('readerTitle').innerText = act.title;
        document.getElementById('readerBody').innerText = act.content;
        overlay.style.display = "block";
    };

    window.closeReader = () => {
        document.getElementById('readerOverlay').style.display = "none";
    };

    // --- 4. ADMIN & AUTH ---
    window.saveToFirebase = async () => {
        const title = document.getElementById('postTitle').value;
        const preview = document.getElementById('postPreview').value;
        const content = document.getElementById('postContent').value;
        const type = document.getElementById('postType').value;

        if(!title || !content) return alert("The Aether requires a Title and Content.");

        await addDoc(collection(db, type), {
            title, preview, content,
            createdAt: serverTimestamp()
        });
        
        // Reset fields
        document.getElementById('postTitle').value = "";
        document.getElementById('postPreview').value = "";
        document.getElementById('postContent').value = "";
        alert("The Grimoire has been updated.");
    };

    onAuthStateChanged(auth, (user) => {
        const isOwner = user && user.uid === ADMIN_UID;
        document.getElementById('architectHUD').style.display = isOwner ? 'block' : 'none';
        document.getElementById('authBtn').innerText = user ? "LOGOUT" : "OWNER";
    });

    document.getElementById('authBtn').onclick = () => {
        if(auth.currentUser) signOut(auth);
        else {
            const e = prompt("Email:"), p = prompt("Password:");
            if(e && p) signInWithEmailAndPassword(auth, e, p).catch(() => alert("Access Denied."));
        }
    };
</script>
